name: Compiler

# - À chaque modification : tests (dont la validation de droits.json) + exe téléchargeable dans « Actions ».
# - Publication automatique : quand le numéro de version (var version dans maj.go) change sur main,
#   la release vX.Y.Z est créée avec le .exe, et le logiciel la détecte automatiquement.
# - Une release publiée à la main (étiquette vX.Y.Z) reçoit aussi son .exe.
on:
  push:
    branches: [main]
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Tests et validation des règles
        run: go test ./...

      - name: Numéro de version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$(grep -oP 'var version = "\K[^"]+' maj.go)"; fi
          echo "V=$V" >> "$GITHUB_ENV"

      - name: Version déjà publiée ?
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "PUBLIER=non" >> "$GITHUB_ENV"; echo "v$V existe déjà."
          else
            echo "PUBLIER=oui" >> "$GITHUB_ENV"; echo "v$V sera publiée."
          fi

      - name: Icône et informations de version
        shell: bash
        run: |
          go install github.com/tc-hib/go-winres@latest
          go-winres make --in winres/winres.json --arch amd64 --file-version "$V.0" --product-version "$V.0"

      - name: Compilation
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=$V" -o AQuoiAiJeLeDroit.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: AQuoiAiJeLeDroit-${{ env.V }}
          path: AQuoiAiJeLeDroit.exe

      - name: Ajout du .exe à la release publiée à la main
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: AQuoiAiJeLeDroit.exe

      - name: Publication automatique de la nouvelle version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.PUBLIER == 'oui'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.V }}
          target_commitish: ${{ github.sha }}
          name: Version ${{ env.V }}
          files: AQuoiAiJeLeDroit.exe
          make_latest: true
          body: |
            Repérage des aides et droits : famille, ressources, santé, logement, handicap, autonomie, retraite, emploi, droit du travail, droit pénal, impôts.

            - Aucune installation : téléchargez AQuoiAiJeLeDroit.exe et lancez-le.
            - Les règles se mettent à jour automatiquement à chaque lancement.
            - Vos réponses restent sur votre ordinateur.

            Au premier lancement, si Windows affiche « Windows a protégé votre ordinateur » : Informations complémentaires → Exécuter quand même.
